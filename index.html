<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TXT Library • GitHub Reader</title><style>:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c1120;color:#eaf0ff}header{padding:18px 24px;background:#151d32;border-bottom:1px solid #34405a}h1{margin:0;font-size:1.5rem}header p{margin:6px 0 0;color:#9eafce}.app{display:grid;grid-template-columns:minmax(240px,320px) 1fr;height:calc(100vh - 93px)}aside{border-right:1px solid #34405a;padding:16px;overflow:auto}main{padding:22px;overflow:auto}input,button{background:#202c46;border:1px solid #425374;color:white;border-radius:9px;padding:11px;font:inherit}input{width:100%;margin-bottom:10px}button{cursor:pointer}button:hover,.item:hover{background:#304363}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.item{display:block;width:100%;text-align:left;padding:12px;margin:7px 0;background:#18233a;border:1px solid #34405a;border-radius:10px;overflow-wrap:anywhere}.item.active{border-color:#75b8ff;background:#263b60}.muted{color:#a7b7d3}.status{font-size:.86rem;margin:12px 0;line-height:1.5}#content{white-space:pre-wrap;overflow-wrap:anywhere;font:1.08rem/1.8 Georgia,serif;max-width:900px;margin:20px auto}#title{margin:0;overflow-wrap:anywhere}#count{color:#a7b7d3;font-size:.9rem;margin:8px 0}@media(max-width:650px){.app{display:block;height:auto}aside{max-height:38vh;border-right:0;border-bottom:1px solid #34405a}main{min-height:60vh}}</style></head><body><header><h1>📚 TXT Library</h1><p>Automatically discover and read text files stored alongside this HTML on GitHub Pages.</p></header><div class="app"><aside><input id="search" placeholder="Search filenames…" aria-label="Search filenames"><div class="toolbar"><button id="refresh">↻ Refresh files</button><button id="choose">📁 Local folder</button><input id="folder" type="file" webkitdirectory multiple accept=".txt,text/plain" hidden></div><div id="count"></div><div id="status" class="status muted">Loading…</div><div id="files"></div></aside><main><div class="toolbar"><button id="smaller">A−</button><button id="larger">A+</button><button id="download" disabled>Download text</button></div><h2 id="title">Choose a text file</h2><article id="content" class="muted">Select a file from the left to read it here.</article></main></div><script>
const $=id=>document.getElementById(id);let entries=[],selected=null,scale=1,mode='remote';const setStatus=s=>$('status').textContent=s;
function repoContext(){let host=location.hostname.toLowerCase(),segments=location.pathname.split('/').filter(Boolean).map(decodeURIComponent);if(!host.endsWith('.github.io'))return null;let owner=host.split('.')[0],repo=segments.shift()||`${owner}.github.io`;if(repo.toLowerCase()===`${owner}.github.io`.toLowerCase()){segments=location.pathname.split('/').filter(Boolean).map(decodeURIComponent)}let folder=segments.slice(0,-1).join('/');return {owner,repo,folder};}
function render(){let q=$('search').value.trim().toLowerCase(),list=entries.filter(e=>e.name.toLowerCase().includes(q));$('count').textContent=`${list.length} of ${entries.length} text files`;$('files').replaceChildren();for(let e of list){let b=document.createElement('button');b.className='item'+(selected===e?' active':'');b.textContent='📄 '+e.name;b.onclick=()=>openFile(e);$('files').append(b)}}
async function discover(){mode='remote';entries=[];selected=null;render();setStatus('Checking GitHub repository…');let ctx=repoContext();if(!ctx){setStatus('This page is not hosted on GitHub Pages. Use “Local folder” to select text files, or publish it to GitHub Pages.');return}let api=`https://api.github.com/repos/${encodeURIComponent(ctx.owner)}/${encodeURIComponent(ctx.repo)}/contents/${ctx.folder.split('/').filter(Boolean).map(encodeURIComponent).join('/')}`;try{let r=await fetch(api,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!r.ok)throw Error(`GitHub API returned ${r.status}. Check the repository name, folder and public visibility.`);let items=await r.json();if(!Array.isArray(items))throw Error('The GitHub path is not a directory.');entries=items.filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.txt')).map(x=>({name:x.name,url:x.download_url})).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));render();setStatus(entries.length?'Ready. Click a file to read it.':'No .txt files found in this folder. Add .txt files alongside this HTML and refresh.')}catch(e){setStatus('Could not discover files automatically: '+e.message+' You can still use “Local folder”.')}}
async function openFile(e){selected=e;render();$('title').textContent=e.name;$('content').textContent='Loading…';try{let txt;if(e.file)txt=await e.file.text();else{let r=await fetch(e.url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);txt=await r.text()}$('content').textContent=txt;$('content').classList.remove('muted');$('download').disabled=false;window.currentText=txt;window.currentName=e.name;}catch(err){$('content').textContent='Unable to open file: '+err.message;$('download').disabled=true}}
$('refresh').onclick=()=>{if(mode==='remote')discover();else $('folder').click()};$('choose').onclick=()=>$('folder').click();$('folder').onchange=e=>{mode='local';entries=Array.from(e.target.files).filter(f=>f.name.toLowerCase().endsWith('.txt')).map(f=>({name:f.webkitRelativePath||f.name,file:f})).sort((a,b)=>a.name.localeCompare(b.name));selected=null;render();setStatus('Local folder loaded. This is a manual fallback; GitHub Pages discovers repository files automatically.')};$('search').oninput=render;$('larger').onclick=()=>{$('content').style.fontSize=(++scale*.12+1.08)+'rem'};$('smaller').onclick=()=>{$('content').style.fontSize=(Math.max(-4,--scale)*.12+1.08)+'rem'};$('download').onclick=()=>{let blob=new Blob([window.currentText],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=window.currentName;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};discover();
</script></body></html>
